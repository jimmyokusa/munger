name: Scheduler heartbeat

# Two independent purposes, both surfaced by review (staff-engineer-
# reviewer/pm-reviewer, M11):
#
# 1. GitHub auto-disables a scheduled workflow after 60 days with no
#    repository activity. Originally written when this project's trading
#    workflow ran quarterly (~91 days -- longer than that window), so
#    without something else touching the repo periodically, its schedule
#    could silently deactivate between cycles. Now that daily-trade.yml
#    (2026-07-26: renamed from quarterly-run.yml, cadence changed to
#    daily -- DESIGN.md section 4) fires every day, its own execution
#    almost certainly counts as "activity" on its own -- but GitHub's
#    docs still don't specify what counts (a scheduled workflow merely
#    executing, vs. an actual push), the same unresolved ambiguity noted
#    at M11, so this step is kept as a harmless, unambiguous safety net
#    rather than removed on an unverified reading.
# 2. A true dead-man's-switch: bot.py's own _check_data_freshness() can
#    only notice a missed run once bot.py actually runs again -- if the
#    scheduler stops firing entirely (disabled, GitHub outage, quota
#    exhaustion), nothing inside bot.py can ever observe that. This
#    workflow checks daily-trade.yml's own run history independently
#    via the GitHub API, so a total scheduling failure gets its own
#    alert (a failed run here, same GH-failure-email channel as
#    everywhere else) instead of silence.
on:
  schedule:
    # 2026-07-26: was monthly (`0 12 1 * *`), matching the quarterly
    # trading cadence this existed to watch. Checking monthly against a
    # 3-day dead-man's-switch threshold (below) would only ever actually
    # notice a stalled scheduler on this job's own next monthly fire --
    # up to ~30 days late, defeating the point of a tight threshold. Now
    # daily, offset from both daily-trade.yml (14:00 UTC) and
    # daily-screen.yml (13:00 UTC) so this doesn't add to their shared
    # yfinance/Wikipedia load window.
    - cron: "0 15 * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Keep repo active (unambiguous, regardless of GitHub's undocumented activity definition)
        # Pushes to a dedicated `heartbeat` branch, not `main` -- a real
        # git push counts as activity under any reading of GitHub's
        # policy, without mixing automated noise into main's history or
        # risking a branch-protection rule that (unlike an unprotected
        # side branch) is more likely to be applied to main specifically.
        run: |
          set -e
          git config user.name "munger-bot"
          git config user.email "munger-bot@users.noreply.github.com"
          mkdir -p /tmp/heartbeat-wt-parent
          git worktree add --detach /tmp/heartbeat-wt-parent/heartbeat-wt
          git -C /tmp/heartbeat-wt-parent/heartbeat-wt checkout --orphan heartbeat
          git -C /tmp/heartbeat-wt-parent/heartbeat-wt rm -rf . >/dev/null 2>&1 || true
          date -u +"%Y-%m-%dT%H:%M:%SZ" > /tmp/heartbeat-wt-parent/heartbeat-wt/last-run
          git -C /tmp/heartbeat-wt-parent/heartbeat-wt add -A
          git -C /tmp/heartbeat-wt-parent/heartbeat-wt commit -q -m "Heartbeat: keep repo active for scheduled-workflow retention"
          git -C /tmp/heartbeat-wt-parent/heartbeat-wt push --force origin HEAD:heartbeat

      - name: Check daily-trade's last execution age
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          last_run_json=$(gh run list --repo "${{ github.repository }}" \
            --workflow=daily-trade.yml --limit 1 --json createdAt,conclusion,status)
          echo "$last_run_json"
          count=$(echo "$last_run_json" | python3 -c "import json, sys; print(len(json.load(sys.stdin)))")
          if [ "$count" -eq 0 ]; then
            echo "daily-trade.yml has never executed yet -- nothing to check (expected before its first scheduled fire)."
            exit 0
          fi
          created_at=$(echo "$last_run_json" | python3 -c "import json, sys; print(json.load(sys.stdin)[0]['createdAt'])")
          age_days=$(python3 -c "
          import datetime
          created = datetime.datetime.fromisoformat('$created_at'.replace('Z', '+00:00'))
          now = datetime.datetime.now(datetime.timezone.utc)
          print((now - created).days)
          ")
          echo "Last daily-trade execution was $age_days days ago."
          # 2026-07-26: threshold shrunk from 130 (quarterly cadence: ~91
          # days + buffer) to 3 (daily cadence: 1 day + a couple of
          # retries' worth of slack) -- a daily job going 130 days
          # unnoticed would defeat the entire point of a dead-man's-switch.
          if [ "$age_days" -gt 3 ]; then
            echo "::error::daily-trade.yml has not executed in $age_days days (expected ~daily cadence + buffer) -- the schedule may be disabled, failing to trigger, or the repo may have hit GitHub's 60-day scheduled-workflow auto-disable."
            exit 1
          fi

      - name: Check analytics endpoint reachability
        # M18's self-hosted GoatCounter (config.ANALYTICS_URL) lives on the
        # user's home network, not this project's infra -- home-network
        # hardening (DNS exposure, cert-renewal automation, container
        # segmentation) is deliberately tracked and fixed in a separate
        # `workspace/home-network` project, per user decision (2026-07-30),
        # not here. munger's own scope stops at *noticing and alerting*
        # through the same GH-failure-email channel as every other check in
        # this workflow -- it does not attempt any home-infra fix itself.
        # Gated on the MUNGER_ANALYTICS_URL repo variable (empty/unset ->
        # skip cleanly), matching the config-gated pattern used everywhere
        # else (GRAFANA_BASE_URL, SITE_BASE_URL). A 3xx (e.g. GoatCounter's
        # own "please log in" redirect) is a healthy response -- curl -f
        # only flags a connection failure or a >=400 status.
        if: always()
        env:
          MUNGER_ANALYTICS_URL: ${{ vars.MUNGER_ANALYTICS_URL }}
        run: |
          set -e
          if [ -z "$MUNGER_ANALYTICS_URL" ]; then
            echo "MUNGER_ANALYTICS_URL not set -- analytics not configured, nothing to check."
            exit 0
          fi
          origin=$(python3 -c "
          import os, urllib.parse
          p = urllib.parse.urlsplit(os.environ['MUNGER_ANALYTICS_URL'])
          print(f'{p.scheme}://{p.netloc}/')
          ")
          echo "Checking $origin"
          if ! curl -fsS --max-time 10 "$origin" -o /dev/null; then
            echo "::error::Analytics endpoint ($origin) is unreachable. This is a notification only -- the fix belongs in the workspace/home-network project, not here."
            exit 1
          fi
          echo "Analytics endpoint reachable."
