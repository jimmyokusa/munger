name: Munger CI

# CI only -- no build/push/deploy (deploys are manual, via
# deploy/cloudrun/deploy.sh). Runs the real quality gates on every push to
# main so a broken commit is visible here instead of only caught by a human
# looking at the deployed site.
#
# GitHub-hosted, like every other workflow in this repo. This used to run on
# a self-hosted pod on the Pi k3s cluster ([self-hosted, k3s, arm64]); when
# that cluster was retired (2026-10), every push sat queued with no runner
# until GitHub cancelled it 24h later -- CI silently stopped gating anything
# while each run still looked merely "pending". The uv-based Python install
# that runner needed (no prebuilt arm64 3.11 for actions/setup-python) went
# with it.
on:
  push:
    branches: [ main, master ]

jobs:
  ci:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    # A hung step would otherwise run to GitHub's 360-minute default. Matches
    # the order of magnitude of the sibling trading workflows' own guards
    # (daily-screen.yml: 30, daily-trade.yml: 45), scaled down since this
    # job does far less.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        # ruff/mypy are pinned here (matching the dev machine's installed
        # versions) rather than left open -- an unrelated push landing
        # between two commits to main shouldn't be able to turn CI red on a
        # new tool release finding something new; that's indistinguishable
        # in the UI from an actual regression and defeats this workflow's
        # whole point. pytest's version already comes from requirements.txt
        # (pytest~=8.4.2) -- not re-specified here to avoid two sources of
        # truth for the same pin. A venv at .venv keeps the step commands
        # below identical to a local run.
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt ruff==0.15.22 mypy==2.3.0

      - name: Ruff
        run: .venv/bin/ruff check .

      - name: Ruff format
        # M30 (Design v2.2 §5): ruff check and ruff format had been
        # allowed to diverge -- `ruff check` was green in this CI while
        # `ruff format --check` had 3 real, unfixed diffs on main
        # (report.py, tests/test_config.py, tests/test_report.py),
        # invisible here because nothing ran it. Fixed those 3 files and
        # added this step so formatting can't silently drift from
        # linting again.
        run: .venv/bin/ruff format --check .

      - name: Mypy
        run: .venv/bin/mypy . --config-file mypy.ini

      - name: Pytest
        # `.venv/bin/pytest` (the console-script entry point) doesn't add the
        # repo root to sys.path the way `-m pytest` does, and there's no
        # conftest.py/pytest.ini establishing that -- so top-level imports
        # (`import config`, `import bot`, etc.) failed live here. Matches
        # the invocation the old in-cluster deploy/archive/k3s/k8s/ci-test-job.yaml used.
        run: .venv/bin/python -m pytest -v
