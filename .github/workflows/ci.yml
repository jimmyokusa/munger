name: Munger CI

# CI only -- no build/push/deploy. The self-hosted runner
# (actions-runner/munger-ci-runner, a bare pod on pi4) has no Docker daemon
# reachable, and no node in the cluster has Docker installed at all (image
# builds have always run on the dev machine, via deploy/build-and-deploy.sh);
# giving the runner that capability is a real infra decision -- see
# DESIGN_CD_PIPELINE.md (still draft, not decided) -- not something this
# workflow should quietly assume. This is the honest, currently-achievable
# slice: run the real (non-neutered) quality gates on every push to main, so
# a broken commit is visible here instead of only caught by a human looking
# at the deployed site. Deploys stay manual (build-and-deploy.sh) until that
# design lands.
on:
  push:
    branches: [ main, master ]

jobs:
  ci:
    name: Lint, typecheck, and test
    runs-on: [ self-hosted, k3s, arm64 ]
    # This runs on the single self-hosted pod (actions-runner/munger-ci-runner,
    # pinned to pi4) -- a hung step would otherwise tie up the only runner for
    # up to GitHub's 360-minute default, silently stopping CI for every push
    # after it. Matches the order of magnitude of the sibling trading
    # workflows' own guards (daily-screen.yml: 30, daily-trade.yml: 45),
    # scaled down since this job does far less.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        # actions/setup-python has no prebuilt arm64 3.11 binary for this
        # runner's Ubuntu 20.04 base (confirmed live -- that's why an
        # earlier version of this workflow never got past this step), and
        # the deadsnakes-PPA workaround also failed live in CI (its
        # focal-codename detection breaks inside this container -- "Cannot
        # add PPA: '~deadsnakes/ubuntu/ppa'"). uv sidesteps apt/PPA
        # entirely: it fetches a standalone prebuilt CPython 3.11 for
        # linux-aarch64 directly (confirmed working live via `kubectl exec`
        # into the runner pod before wiring this in). Pinned to a specific
        # release (astral's documented pinning mechanism -- a versioned
        # install-script URL) rather than the unversioned latest, so a
        # compromised or changed upstream script can't execute unpinned on
        # every push to main.
        run: |
          curl -LsSf https://astral.sh/uv/0.12.3/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        # ruff/mypy are pinned here (matching the dev machine's installed
        # versions) rather than left open -- an unrelated push landing
        # between two commits to main shouldn't be able to turn CI red on a
        # new tool release finding something new; that's indistinguishable
        # in the UI from an actual regression and defeats this workflow's
        # whole point. pytest's version already comes from requirements.txt
        # (pytest~=8.4.2) -- not re-specified here to avoid two sources of
        # truth for the same pin.
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python ruff==0.15.22 mypy==2.3.0

      - name: Ruff
        run: .venv/bin/ruff check .

      - name: Ruff format
        # M30 (Design v2.2 §5): ruff check and ruff format had been
        # allowed to diverge -- `ruff check` was green in this CI while
        # `ruff format --check` had 3 real, unfixed diffs on main
        # (report.py, tests/test_config.py, tests/test_report.py),
        # invisible here because nothing ran it. Fixed those 3 files and
        # added this step so formatting can't silently drift from
        # linting again.
        run: .venv/bin/ruff format --check .

      - name: Mypy
        run: .venv/bin/mypy . --config-file mypy.ini

      - name: Pytest
        # `.venv/bin/pytest` (the console-script entry point) doesn't add the
        # repo root to sys.path the way `-m pytest` does, and there's no
        # conftest.py/pytest.ini establishing that -- so top-level imports
        # (`import config`, `import bot`, etc.) failed live here. Matches
        # the invocation deploy/k8s/ci-test-job.yaml already uses.
        run: .venv/bin/python -m pytest -v
