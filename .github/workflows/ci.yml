name: Munger CI

# CI only -- no build/push/deploy. The self-hosted runner
# (actions-runner/munger-ci-runner, a bare pod on pi4) has no Docker daemon
# reachable, and no node in the cluster has Docker installed at all (image
# builds have always run on the dev machine, via deploy/build-and-deploy.sh);
# giving the runner that capability is a real infra decision -- see
# DESIGN_CD_PIPELINE.md (still draft, not decided) -- not something this
# workflow should quietly assume. This is the honest, currently-achievable
# slice: run the real (non-neutered) quality gates on every push to main, so
# a broken commit is visible here instead of only caught by a human looking
# at the deployed site. Deploys stay manual (build-and-deploy.sh) until that
# design lands.
on:
  push:
    branches: [ main, master ]

jobs:
  ci:
    name: Lint, typecheck, and test
    runs-on: [ self-hosted, k3s, arm64 ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        # actions/setup-python has no prebuilt arm64 3.11 binary for this
        # runner's Ubuntu 20.04 base (confirmed live -- that's why an
        # earlier version of this workflow never got past this step), and
        # the deadsnakes-PPA workaround also failed live in CI (its
        # focal-codename detection breaks inside this container -- "Cannot
        # add PPA: '~deadsnakes/ubuntu/ppa'"). uv sidesteps apt/PPA
        # entirely: it fetches a standalone prebuilt CPython 3.11 for
        # linux-aarch64 directly (confirmed working live via `kubectl exec`
        # into the runner pod before wiring this in).
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python ruff mypy pytest

      - name: Ruff
        run: .venv/bin/ruff check .

      - name: Mypy
        run: .venv/bin/mypy . --config-file mypy.ini

      - name: Pytest
        run: .venv/bin/pytest -v
