name: Daily screen and trade run

# DESIGN.md section 4 (2026-07-26 revision): daily cadence, superseding
# the original quarterly-only default. 14:00 UTC -- one hour after
# daily-screen.yml's own 13:00 UTC run, so the two don't hit the same
# yfinance/Wikipedia rate limits simultaneously (this workflow runs its
# own independent screen via bot.py -> screener.run_screen, not a shared
# fetch with daily-screen.yml's report-only run). The rebalancing drift
# band (config.REBALANCE_DRIFT_BAND_PCT, portfolio.py) is what keeps
# actual daily order volume low despite the daily trigger -- see
# DESIGN.md section 1/4 for why running daily doesn't mean trading daily.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      screen_only:
        description: "Force KILL_SWITCH (screen-only, no broker calls) for this manual run"
        type: boolean
        default: true

# Staff-engineer-reviewer finding (M10 review): nothing prevented two
# overlapping bot.py invocations (an overrun run plus its next scheduled
# trigger, or a manual re-run) from racing on state.json/journal.db. A
# workflow-level concurrency group is the natural place for this -- it's
# a scheduling-layer concern, not something bot.py itself should own.
# `cancel-in-progress: false` queues a second trigger rather than killing
# an in-flight run partway through order submission.
concurrency:
  group: daily-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Outer process-level timeout (staff-engineer-reviewer, M2/M11):
    # fetch_all_metrics() bounds its own logical wait but can't force-kill
    # an already-hung worker thread; this is the outer safety net. If it
    # fires mid-run, order idempotency is unaffected (broker-anchored via
    # client_order_id, not this workflow), but the "Persist bot state"
    # step could be cut off, regressing state.json/journal.db to the
    # prior snapshot -- a bounded, known risk (spurious reconciliation
    # warnings next run, not corruption), not solved further here.
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # GitHub Actions runners are ephemeral -- nothing written during a
      # run survives to the next scheduled invocation unless persisted
      # somewhere durable. state.json (strike counters) and journal.db
      # (the append-only trade journal reconciliation depends on) are
      # both load-bearing for correctness, not just logs -- losing them
      # every run would silently reset the two-strike sell discipline and
      # make every real holding look like an unexpected reconciliation
      # mismatch. Persisted here via a dedicated `bot-state` branch (git
      # itself as the durable store) rather than actions/cache -- daily
      # runs now fit inside actions/cache's 7-day eviction window, but a
      # git branch has no eviction window at all (a missed weekend/outage
      # of any length can't silently lose state) and the mechanism was
      # already built, so there's no reason to switch.
      - name: Prepare persisted bot-state branch
        run: |
          set -e
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch origin bot-state
            git worktree add ../bot-state-wt -b bot-state origin/bot-state
          else
            echo "No bot-state branch yet -- first run, starting fresh."
            git worktree add --detach ../bot-state-wt
            git -C ../bot-state-wt checkout --orphan bot-state
            git -C ../bot-state-wt rm -rf . >/dev/null 2>&1 || true
          fi
          for f in state.json journal.db munger.log; do
            if [ -f "../bot-state-wt/$f" ]; then
              cp "../bot-state-wt/$f" .
              echo "Restored $f from bot-state branch."
            fi
          done
          if [ -d ../bot-state-wt/screen_results_archive ]; then
            mkdir -p screen_results_archive
            cp -a ../bot-state-wt/screen_results_archive/. screen_results_archive/
            echo "Restored screen_results_archive/ from bot-state branch."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Force screen-only mode for this manual run
        if: github.event_name == 'workflow_dispatch' && inputs.screen_only
        run: touch KILL_SWITCH

      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python bot.py

      - name: Persist bot state
        if: always()
        run: |
          set -e
          git config user.name "munger-bot"
          git config user.email "munger-bot@users.noreply.github.com"
          for f in state.json journal.db munger.log; do
            [ -f "$f" ] && cp "$f" ../bot-state-wt/
          done
          if [ -d screen_results_archive ]; then
            mkdir -p ../bot-state-wt/screen_results_archive
            cp -a screen_results_archive/. ../bot-state-wt/screen_results_archive/
          fi
          cd ../bot-state-wt
          git add -A
          git commit -q -m "State snapshot from run ${{ github.run_id }}" --allow-empty
          git push origin HEAD:bot-state

      - name: Upload run artifacts for manual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-artifacts-${{ github.run_id }}
          path: |
            munger.log
            journal.db
            state.json
            screen_results.csv
          if-no-files-found: ignore
          retention-days: 400

      # New milestone (user request): track P&L, paper for now, extensible
      # to real money later. report.py's own deployment (Cloud Run/k3s)
      # deliberately never has Alpaca credentials (DESIGN.md 3.5/M14's
      # screen-only boundary), so pnl.py runs here -- where the keys
      # already live -- and the two steps below bridge the result to the
      # same GCS bucket report.py's deployment reads from. `if: always()`
      # on both: a P&L snapshot is a display concern (pnl.py's own module
      # docstring), independent of whether "Run bot" above succeeded,
      # placed any orders, or ran in screen-only mode -- the account and
      # its positions exist regardless.
      # Durable P&L history bridge (M17, DESIGN_DASHBOARDS.md 2.1). pnl.py's
      # update_history_series() is a read-modify-write upsert against a local
      # pnl_history.jsonl -- but the GitHub Actions runner is ephemeral, so
      # unless the prior series is restored *before* pnl.py runs, every run
      # starts from an empty file and re-seeds only Alpaca's rolling ~1-month
      # window, losing the older days the durable file exists to preserve.
      # This step restores it from GCS; the upload step below writes it back.
      # A missing object is the expected first-run case (pnl.py then seeds
      # from Alpaca's history array) and is tolerated -- but any OTHER
      # failure (a transient network blip, an IAM regression, a wrong
      # bucket path) must abort the job loudly instead. Silently treating
      # every failure as "first run" would let pnl.py reseed only the ~30-day
      # rolling window, and the always-run upload step below would then
      # permanently overwrite the durable GCS history with that truncated
      # file -- with the job showing green and nothing paging anyone. NOTE:
      # GCP_PNL_WRITER_KEY's service account must have read
      # (storage.objects.get) on the bucket, not only create/write, for this
      # download to work -- confirm its role includes objectViewer/
      # objectAdmin, not objectCreator-only.
      - name: Download prior P&L history from GCS
        id: download-pnl-history
        if: always()
        env:
          GCP_PNL_WRITER_KEY: ${{ secrets.GCP_PNL_WRITER_KEY }}
        run: |
          key_file="$(mktemp)"
          printf '%s' "$GCP_PNL_WRITER_KEY" > "$key_file"
          gcloud auth activate-service-account --key-file="$key_file"
          if output=$(gcloud storage cp gs://munger-503515-data/pnl_history.jsonl pnl_history.jsonl 2>&1); then
            echo "Restored pnl_history.jsonl from GCS ($(wc -l < pnl_history.jsonl) rows)."
          elif echo "$output" | grep -q "matched no objects"; then
            echo "No existing pnl_history.jsonl in GCS (first run) -- pnl.py will seed it from Alpaca history."
          else
            echo "$output" >&2
            echo "real_failure=true" >> "$GITHUB_OUTPUT"
            rm -f "$key_file"
            echo "::error::gcloud storage cp failed for a reason other than 'object not found' -- marking this run's local pnl_history.jsonl unusable so the upload step below skips it rather than overwriting the durable GCS history with a truncated reseed." >&2
            exit 1
          fi
          rm -f "$key_file"

      # DISCORD_WEBHOOK_URL (M20, user request): pnl.py posts a Discord
      # alert if any held position is down past
      # config.POSITION_LOSS_ALERT_THRESHOLD_PCT. Only wired into this
      # once-daily canonical run and daily-trade-live.yml's own -- not
      # pnl-snapshot.yml's 30-min intraday cadence, which would otherwise
      # mean up to 13 messages/day for one position that stays down.
      - name: Generate P&L snapshot
        if: always()
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python pnl.py

      # Held-symbol daily close prices (M17 Phase 2, DESIGN_DASHBOARDS.md
      # §3) -- feeds Graph 2 ("daily close price per owned ticker"). Runs
      # after "Generate P&L snapshot" and reads its pnl.json output for the
      # held-symbol list (see prices.py's own __main__ docstring), so the
      # two can never disagree about which symbols are "held" this run.
      # `if: always()` for the same reason as the P&L steps above: this is
      # a display concern, independent of whether "Run bot" succeeded or
      # ran in screen-only mode. Unlike pnl_history.jsonl, prices.json is
      # NOT an append-series (Alpaca's historical bars endpoint has no
      # rolling-window loss), so there is no "download prior state first"
      # step needed here -- each run's prices.json is a complete, fresh
      # fetch on its own.
      - name: Generate held-symbol price history
        if: always()
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python prices.py

      # Daily Claude-written news/performance digest (M22, user request).
      # Runs after pnl.py (reads its pnl.json for the held-symbol list,
      # same as prices.py above) and is entirely soft-fail internally --
      # news_update.py never raises on a broken Alpaca News call, a
      # refused/rate-limited Anthropic call, or a Discord outage, so this
      # step can't fail the job. `if: always()` for the same reason as the
      # P&L/prices steps: this is a display concern, independent of
      # whether "Run bot" succeeded or ran in screen-only mode.
      - name: Generate daily news digest
        if: always()
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_NEWS_WEBHOOK_URL: ${{ secrets.DISCORD_NEWS_WEBHOOK_URL }}
        run: python news_update.py

      - name: Upload P&L snapshot and history to GCS
        if: always()
        env:
          # Passed as an env var, not templated directly into the shell
          # script -- the key is multi-line JSON, and bash preserves an
          # env var's exact content through "$VAR" where a raw template
          # substitution into the YAML body would risk quoting/newline
          # issues. Matches how ALPACA_API_KEY is already passed above.
          GCP_PNL_WRITER_KEY: ${{ secrets.GCP_PNL_WRITER_KEY }}
        run: |
          if [ ! -f pnl.json ] && [ ! -f pnl_history.jsonl ] && [ ! -f prices.json ]; then
            echo "No pnl.json, pnl_history.jsonl, or prices.json produced this run -- skipping upload."
            exit 0
          fi
          key_file="$(mktemp)"
          printf '%s' "$GCP_PNL_WRITER_KEY" > "$key_file"
          gcloud auth activate-service-account --key-file="$key_file"
          if [ -f pnl.json ]; then
            gcloud storage cp pnl.json gs://munger-503515-data/pnl.json
          fi
          # The durable append-series -- upload after the upsert so the next
          # run (and the k3s/prod bridges) see today's row. Skipped if the
          # download step above hit a real (non-"not found") failure: pnl.py
          # would then have reseeded only Alpaca's ~30-day rolling window
          # locally, and uploading that now would permanently overwrite the
          # durable GCS history with a truncated file.
          if [ -f pnl_history.jsonl ] && [ "${{ steps.download-pnl-history.outputs.real_failure }}" != "true" ]; then
            gcloud storage cp pnl_history.jsonl gs://munger-503515-data/pnl_history.jsonl
          fi
          # prices.json is a fresh fetch each run (not an append-series --
          # see "Generate held-symbol price history" above), so unlike
          # pnl_history.jsonl there's no truncated-reseed risk gating this
          # upload; a missing file (prices.py step failed, or itself found
          # no held symbols to fetch for) just means nothing to upload.
          if [ -f prices.json ]; then
            gcloud storage cp prices.json gs://munger-503515-data/prices.json
          fi
          rm -f "$key_file"
