name: Execute trades, live account (monthly)

# M34 (Design v2.2 §3.1) -- live-account counterpart to
# execute-trades.yml. Same module (execute_trades.py), separate workflow
# file and separate credentials, per M20's paper/live isolation rule.
# See execute-trades.yml's own header for the full rationale, why this
# landed dispatch-only, and the DO NOT dispatch alongside daily-trade-
# live.yml's own cron warning (identical reasoning, this account's own
# client_order_id scheme). See evaluate-holdings-live.yml's header for
# why MUNGER_LIVE_TRADING_ENABLED is deliberately not set here.
on:
  workflow_dispatch:
    inputs:
      screen_only:
        description: "Force KILL_SWITCH (screen-only, no broker calls) for this manual run"
        type: boolean
        default: true

# Shared with daily-trade-live.yml and evaluate-holdings-live.yml
# (`bot-state-live`) -- see daily-trade.yml's own comment on its
# concurrency block for the full reasoning.
concurrency:
  group: bot-state-live
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare persisted bot-state-live branch
        run: |
          set -e
          if git ls-remote --exit-code --heads origin bot-state-live >/dev/null 2>&1; then
            git fetch origin bot-state-live
            git worktree add ../bot-state-wt -b bot-state-live origin/bot-state-live
          else
            echo "No bot-state-live branch yet -- first run, starting fresh."
            git worktree add --detach ../bot-state-wt
            git -C ../bot-state-wt checkout --orphan bot-state-live
            git -C ../bot-state-wt rm -rf . >/dev/null 2>&1 || true
          fi
          for f in state.json journal.db munger.log; do
            if [ -f "../bot-state-wt/$f" ]; then
              cp "../bot-state-wt/$f" .
              echo "Restored $f from bot-state-live branch."
            fi
          done
          if [ -d ../bot-state-wt/screen_results_archive ]; then
            mkdir -p screen_results_archive
            cp -a ../bot-state-wt/screen_results_archive/. screen_results_archive/
            echo "Restored screen_results_archive/ from bot-state-live branch."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Force screen-only mode for this manual run
        if: github.event_name == 'workflow_dispatch' && inputs.screen_only
        run: touch KILL_SWITCH

      - name: Run execute (live account)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_LIVE_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_LIVE_SECRET_KEY }}
          MUNGER_PAPER_TRADING: "false"
        run: python execute_trades.py

      - name: Persist bot-state-live
        if: always()
        run: |
          set -e
          git config user.name "munger-bot-live"
          git config user.email "munger-bot@users.noreply.github.com"
          for f in state.json journal.db munger.log; do
            [ -f "$f" ] && cp "$f" ../bot-state-wt/
          done
          if [ -d screen_results_archive ]; then
            mkdir -p ../bot-state-wt/screen_results_archive
            cp -a screen_results_archive/. ../bot-state-wt/screen_results_archive/
          fi
          cd ../bot-state-wt
          git add -A
          git commit -q -m "Execute state snapshot from run ${{ github.run_id }}" --allow-empty
          git push origin HEAD:bot-state-live

      - name: Upload run artifacts for manual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execute-live-run-artifacts-${{ github.run_id }}
          path: |
            munger.log
            journal.db
            state.json
            screen_results.csv
          if-no-files-found: ignore
          retention-days: 400
