name: Execute trades, ira account (monthly)

# M47 -- ira-account counterpart to execute-trades-live.yml. Same module
# (execute_trades.py), separate workflow file and separate credentials,
# per M20's paper/live isolation rule generalized to a third account
# (DESIGN_REAL_MONEY.md §3.1; config.py's ACCOUNT_LABEL comment). See
# execute-trades.yml's own header for the full rationale and why this
# landed dispatch-only, and daily-trade-ira.yml's own header for why no
# cron exists yet for this account at all. MUNGER_IRA_TRADING_ENABLED is
# deliberately not set here, mirroring execute-trades-live.yml's own
# "not set" posture relative to daily-trade-live.yml -- an extra layer
# independent of this workflow's own dispatch-only posture, not a
# substitute for it.
on:
  workflow_dispatch:
    inputs:
      screen_only:
        description: "Force KILL_SWITCH (screen-only, no broker calls) for this manual run"
        type: boolean
        default: true

# Shared with daily-trade-ira.yml and evaluate-holdings-ira.yml
# (`bot-state-ira`) -- see daily-trade.yml's own comment on its
# concurrency block for the full reasoning.
concurrency:
  group: bot-state-ira
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare persisted bot-state-ira branch
        run: |
          set -e
          if git ls-remote --exit-code --heads origin bot-state-ira >/dev/null 2>&1; then
            git fetch origin bot-state-ira
            git worktree add ../bot-state-wt -b bot-state-ira origin/bot-state-ira
          else
            echo "No bot-state-ira branch yet -- first run, starting fresh."
            git worktree add --detach ../bot-state-wt
            git -C ../bot-state-wt checkout --orphan bot-state-ira
            git -C ../bot-state-wt rm -rf . >/dev/null 2>&1 || true
          fi
          for f in state.json journal.db munger.log; do
            if [ -f "../bot-state-wt/$f" ]; then
              cp "../bot-state-wt/$f" .
              echo "Restored $f from bot-state-ira branch."
            fi
          done
          if [ -d ../bot-state-wt/screen_results_archive ]; then
            mkdir -p screen_results_archive
            cp -a ../bot-state-wt/screen_results_archive/. screen_results_archive/
            echo "Restored screen_results_archive/ from bot-state-ira branch."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Force screen-only mode for this manual run
        if: github.event_name == 'workflow_dispatch' && inputs.screen_only
        run: touch KILL_SWITCH

      - name: Run execute (ira account)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_IRA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_IRA_SECRET_KEY }}
          MUNGER_PAPER_TRADING: "false"
          MUNGER_ACCOUNT_LABEL: "ira"
        run: python execute_trades.py

      - name: Persist bot-state-ira
        if: always()
        run: |
          set -e
          git config user.name "munger-bot-ira"
          git config user.email "munger-bot@users.noreply.github.com"
          for f in state.json journal.db munger.log; do
            [ -f "$f" ] && cp "$f" ../bot-state-wt/
          done
          if [ -d screen_results_archive ]; then
            mkdir -p ../bot-state-wt/screen_results_archive
            cp -a screen_results_archive/. ../bot-state-wt/screen_results_archive/
          fi
          cd ../bot-state-wt
          git add -A
          git commit -q -m "Execute state snapshot from run ${{ github.run_id }}" --allow-empty
          git push origin HEAD:bot-state-ira

      - name: Upload run artifacts for manual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execute-ira-run-artifacts-${{ github.run_id }}
          path: |
            munger.log
            journal.db
            state.json
            screen_results.csv
          if-no-files-found: ignore
          retention-days: 400
