# www.gramunger.com and gramunger.com serve identical content from the same
# GCS-backed root with no distinction between them -- Google Search Console
# flagged this as "duplicate without user-selected canonical" (the <link
# rel=canonical> in report.py's <head> is only a hint; Google wants an actual
# HTTP redirect to fully consolidate). config.SITE_BASE_URL/sitemap.xml/the
# canonical tag all already treat the bare apex as canonical, so redirect the
# www host to it here rather than picking a new canonical.
server {
    listen 8080;
    server_name www.gramunger.com;
    return 301 https://gramunger.com$request_uri;
}

server {
    # default_server: nginx falls back to the *first* server block listening
    # on this port when a request's Host header matches neither server_name
    # -- without this flag explicitly reassigning it, the www redirect block
    # above (defined first) would silently become the fallback, incorrectly
    # 301-ing every Host that isn't literally "www.gramunger.com" (bare
    # apex included) instead of serving content. Caught live in a local
    # docker+curl test before deploy: an unmatched Host wrongly got a 301.
    listen 8080 default_server;
    server_name _;

    # Root cause of a real production bug (2026-09-04, found live via the
    # user's own browser testing, not caught by any pre-deploy curl
    # check): nginx's default `absolute_redirect on` auto-qualifies EVERY
    # relative Location on a 3xx response -- not just explicit `return`
    # statements, but also try_files' own implicit directory-trailing-
    # slash redirects -- using nginx's own internal view of scheme/host/
    # port. Behind Cloud Run's front-end (which terminates TLS at 443 and
    # forwards plain HTTP to this container's port 8080), that internal
    # view is "http" on port 8080, not the real public "https" on 443 --
    # so every such redirect came back as e.g.
    # "http://gramunger.com:8080/oauth2/sign_in?...", an address nothing
    # public serves. Cloudflare then failed to connect and returned a 522.
    # This was silently present even before M44 (the local docker-compose
    # test run during M44's own build caught the exact same symptom on
    # the pre-existing /pnl.json trailing-slash redirect and was
    # misdiagnosed at the time as purely a bind-mount permission artifact
    # of that scratch test setup -- it was really this, on a path nobody
    # had exercised through a real browser before). Two more explicit
    # `$scheme`/`$host` fixes were tried and deployed first and did NOT
    # fix this on their own, because the auto-qualification happens
    # regardless of whether the relative URL was hardcoded or built from
    # request variables. `absolute_redirect off` is the actual fix --
    # every Location this server emits becomes purely path-relative,
    # which browsers correctly resolve against whatever origin they're
    # really on.
    absolute_redirect off;

    # /mnt/data is the GCS FUSE volume mount (Cloud Run --add-volume);
    # report/ is where report.generate_report() writes under MUNGER_DATA_DIR.
    root /mnt/data/report;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # M19 (DESIGN.md 3.8.1): pnl.py now writes pnl.json to GCS up to every
    # 30 minutes during market hours (pnl-snapshot.yml), but the file lives
    # at DATA_DIR root (/mnt/data/pnl.json), deliberately outside REPORT_DIR
    # (config.PNL_DATA_PATH's own comment: it sits alongside journal.db/
    # state.json, neither of which should ever be web-reachable). An
    # *exact-match* location -- not a prefix alias, which is nginx's classic
    # footgun for leaking sibling files/directory listings -- serves only
    # this one path from the live FUSE mount (already always current, no
    # separate bridge step needed here) so pnl.html's client-side poller can
    # fetch fresher data than the once/day static bake without exposing
    # anything else under /mnt/data.
    location = /pnl.json {
        alias /mnt/data/pnl.json;
        add_header Cache-Control "no-store";
    }

    # M20 (DESIGN_REAL_MONEY.md §4): the live account's own snapshot, same
    # treatment as pnl.json above and deliberately a second, independent
    # block rather than a generalization of it -- no shared code path
    # that a change here could risk on the already-proven paper pipeline.
    # Alias target is /mnt/data/live/pnl.json, NOT /mnt/data/real_money.json
    # -- the public URL path stays /real_money.json (report.py's poller and
    # the Cloudflare Access rule both already target that), but the file on
    # the FUSE mount is wherever daily-trade-live.yml actually uploads it
    # (gs://.../live/pnl.json, confirmed live) -- config.REAL_MONEY_DATA_PATH
    # was fixed to match this same real path after a mismatch was caught
    # live during the k3s dev deploy.
    # M44 (DESIGN_REAL_MONEY.md §6, superseding the Cloudflare Access plan):
    # both real-money paths sit behind oauth2-proxy, run as a sidecar in
    # this same Cloud Run service and reachable only via localhost:4180
    # (never exposed on 8080 directly) -- nginx's auth_request module makes
    # a subrequest to it before serving either path. Gating BOTH paths
    # deliberately, not just the .html one: real-money.html (hyphen) and
    # real_money.json (underscore) don't share a path prefix, so a reader
    # who knew/guessed the JSON filename could otherwise read the live
    # account's real numbers with the HTML page still locked down -- the
    # exact gotcha the earlier (now-superseded) Cloudflare Access design
    # already found and is preserved here.
    # Verbatim structure from oauth2-proxy's own documented nginx
    # auth_request integration (configuration/integrations/nginx/), not
    # improvised: the /oauth2/ and /oauth2/auth blocks, the named
    # @oauth2_signin location, and the Set-Cookie passthrough (needed for
    # --cookie-refresh to work through auth_request) are all as documented
    # there -- only the two protected `location` blocks below are this
    # site's own.
    location /oauth2/ {
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host                    $host;
        proxy_set_header X-Real-IP               $remote_addr;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-Uri  $request_uri;
        # nginx auth_request includes headers but not body.
        proxy_set_header Content-Length   "";
        proxy_pass_request_body off;
    }

    # `rd` is a relative path, not `$scheme://$host$request_uri` (the
    # form oauth2-proxy's own docs show). Real bug, found live: behind
    # Cloud Run's own front-end proxy (which terminates TLS and forwards
    # plain HTTP to this container's internal port), $scheme/$host don't
    # reflect the public https://gramunger.com origin -- they reflect the
    # internal connection, producing a Location header of
    # "http://gramunger.com:8080/oauth2/sign_in?rd=http://gramunger.com:8080/..."
    # in production, port 8080 being nginx's own container port, never
    # reachable from the public internet. Cloudflare then tried to
    # connect a browser to that unreachable address and failed with a
    # 522. oauth2-proxy's own `rd` handling only accepts relative
    # redirect targets anyway (open-redirect protection) -- a bare
    # $request_uri sidesteps the whole scheme/host reconstruction
    # problem rather than hardcoding the public origin as a workaround.
    location @oauth2_signin {
        add_header Cache-Control "no-store" always;
        return 302 /oauth2/sign_in?rd=$request_uri;
    }

    location = /real-money.html {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        try_files $uri =404;
    }

    location = /real_money.json {
        auth_request /oauth2/auth;
        error_page 401 = @oauth2_signin;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        alias /mnt/data/live/pnl.json;
        add_header Cache-Control "no-store";
    }
}
