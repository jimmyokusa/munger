# M17 (DESIGN_DASHBOARDS.md 2.3): dev Grafana, provisioned-stateless.
#
# READS, NEVER MOUNTS THE PVC. The munger-data PVC is ReadWriteOnce and
# lives on pi1; Grafana is deliberately pinned OFF pi1 (pi1 is the PVC host
# and is memory-tight -- 30-daily-screen-cronjob.yaml's own comment). So
# Grafana does not mount the PVC at all: it reads the bridged P&L files over
# HTTP from the in-cluster nginx report Service (munger-report), which the
# GCS->PVC bridge (40-gcs-reader-cronjob.yaml) publishes into /data/report.
#
# STATELESS. No persistent volume: dashboards + the Infinity datasource are
# provisioned from ConfigMaps at startup, and Grafana's own DB is an
# emptyDir (nothing to lose -- everything is re-provisioned on restart). To
# change a dashboard, edit the ConfigMap and re-apply; do not edit in the UI.
#
# LOCKED DOWN (DESIGN_DASHBOARDS.md 2.3, staff-eng 9.B-8). Anonymous
# Viewer-only, login form + basic auth disabled, sign-up disabled, Explore
# disabled, viewers can't edit. Embedding allowed so report.py's
# dashboards.html <iframe> can host it.
#
# INFINITY PLUGIN. Installed at startup via GF_INSTALL_PLUGINS, which needs
# outbound internet on the scheduling node the first time (like the
# cloud-sdk image). If the node is offline, bake a custom image with the
# plugin instead.
#
# PINNED to 3.11.1, not unpinned/"latest" (2026-08-08, found live building
# the Prices panel): v3.11.2 (released 2026-08-05) shipped a real,
# currently-unfixed regression -- the plugin's frontend module fails to
# load entirely ("404 Not Found, loading react/jsx-runtime", SystemJS
# Error#7), confirmed both via a local Grafana+Infinity container/browser
# test and against the upstream report (grafana/grafana-infinity-
# datasource#1772, opened 2026-08-06, still open, no fix released as of
# this pin). GF_INSTALL_PLUGINS re-fetches "latest" on every pod restart
# (this deployment is provisioned-stateless by design) -- unpinned, the
# *next* restart for any reason (node reschedule, a manifest reapply,
# routine maintenance) would have silently broken this dashboard AND the
# already-shipped account-pnl one, with nothing here having changed.
# Re-evaluate this pin once upstream ships a fix past v3.11.2.
#
# SHARED INSTANCE (discovered live, 2026-08-08). This Grafana Deployment is
# no longer exclusively munger's: a separate project (home-network Unifi/
# node-exporter monitoring) has added its own dashboards directly onto this
# same instance -- ConfigMaps munger-grafana-dashboard-node-exporter,
# -unifi-gateway, -unifi-sites, -unifi-clients, none of them defined in this
# repo. The Deployment below REFERENCES those ConfigMaps by name (volume +
# volumeMount only) purely so that applying this file doesn't drop them --
# it does not define or own their content, which lives/changes entirely
# outside this repo. If `kubectl get deployment munger-grafana -o yaml`
# ever shows volumes not listed here, reconcile this file from that live
# state before applying, the same way this reconciliation was done -- a
# blind `kubectl apply` of a stale version of this file silently deletes
# whatever it doesn't know about. The dashboard-provider's editable/
# allowUiUpdates below was also found live as `true` (this repo originally
# shipped `false`, a deliberate lock-down) and is matched here rather than
# reverted, since it wasn't this repo's change to unmake; anonymous
# viewers still cannot edit anything regardless (GF_AUTH_ANONYMOUS_ORG_ROLE
# stays Viewer, GF_USERS_VIEWERS_CAN_EDIT stays false, below), so this is
# low-risk either way.
apiVersion: v1
kind: ConfigMap
metadata:
  name: munger-grafana-datasources
  namespace: munger
  labels:
    app.kubernetes.io/name: munger-grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Munger P&L (Infinity)
        uid: infinity-munger
        type: yesoreyeram-infinity-datasource
        access: proxy
        isDefault: true
        editable: false
        jsonData:
          # Server-side (proxy) fetches avoid browser CORS; the URL is the
          # in-cluster nginx Service that serves the bridged /data/report.
          global_queries: []
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: munger-grafana-dashboard-provider
  namespace: munger
  labels:
    app.kubernetes.io/name: munger-grafana
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: munger
        orgId: 1
        type: file
        disableDeletion: true
        editable: false
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
      # Separate provider + directory for the Prices dashboard (M17 Phase
      # 2), deliberately not sharing /var/lib/grafana/dashboards with the
      # already-live account-pnl provider above -- avoids any risk to that
      # proven-working mount/provisioning path (whether Grafana's file
      # provisioner recurses into subdirectories of an existing provider's
      # path wasn't worth testing against a live dashboard to find out).
      - name: munger-prices
        orgId: 1
        type: file
        disableDeletion: true
        editable: false
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards-prices
          foldersFromFilesStructure: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: munger-grafana-dashboard-account-pnl
  namespace: munger
  labels:
    app.kubernetes.io/name: munger-grafana
data:
  # Graph 1 (DESIGN_DASHBOARDS.md 2.2): account equity + daily P&L over time,
  # read from the durable pnl_history series via the Infinity datasource. The
  # bridge publishes a JSON-array rendition (pnl_history.json) because Infinity
  # parses JSON, not NDJSON. Raw provisioned-dashboard model (not the API
  # {"dashboard":...} envelope).
  account-pnl.json: |
    {
      "uid": "munger-account-pnl",
      "title": "Account P&L over time",
      "tags": ["munger"],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "refresh": "",
      "time": {"from": "now-1y", "to": "now"},
      "templating": {"list": []},
      "annotations": {"list": []},
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Account equity over time",
          "description": "Daily account equity from the durable pnl_history series.",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 0},
          "datasource": {"type": "yesoreyeram-infinity-datasource", "uid": "infinity-munger"},
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "custom": {"drawStyle": "line", "lineWidth": 2, "fillOpacity": 8, "showPoints": "auto", "spanNulls": true}
            },
            "overrides": []
          },
          "options": {
            "tooltip": {"mode": "single", "sort": "none"},
            "legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "yesoreyeram-infinity-datasource", "uid": "infinity-munger"},
              "type": "json",
              "source": "url",
              "format": "table",
              "url": "http://munger-report.munger.svc.cluster.local/pnl_history.json",
              "url_options": {"method": "GET", "data": ""},
              "root_selector": "",
              "columns": [
                {"selector": "date", "text": "Date", "type": "timestamp"},
                {"selector": "equity", "text": "Equity", "type": "number"}
              ],
              "filters": []
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Daily profit / loss",
          "description": "Daily profit_loss from the durable pnl_history series.",
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 10},
          "datasource": {"type": "yesoreyeram-infinity-datasource", "uid": "infinity-munger"},
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "custom": {"drawStyle": "bars", "lineWidth": 1, "fillOpacity": 60, "spanNulls": false},
              "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 0}]},
              "color": {"mode": "thresholds"}
            },
            "overrides": []
          },
          "options": {
            "tooltip": {"mode": "single", "sort": "none"},
            "legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "yesoreyeram-infinity-datasource", "uid": "infinity-munger"},
              "type": "json",
              "source": "url",
              "format": "table",
              "url": "http://munger-report.munger.svc.cluster.local/pnl_history.json",
              "url_options": {"method": "GET", "data": ""},
              "root_selector": "",
              "columns": [
                {"selector": "date", "text": "Date", "type": "timestamp"},
                {"selector": "profit_loss", "text": "Profit / loss", "type": "number"}
              ],
              "filters": []
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: munger-grafana-dashboard-prices
  namespace: munger
  labels:
    app.kubernetes.io/name: munger-grafana
data:
  # Graph 2 (DESIGN_DASHBOARDS.md 2.2/§3): daily close price per currently-
  # held ticker. Reads prices_flat.json -- gcs_bridge.py's long-format
  # derivation of prices.py's own nested-by-symbol prices.json (one row
  # per {symbol, date, close}), the shape Grafana's own "Partition by
  # values" transform (id: partitionByValues) expects to split into a
  # per-symbol multi-series chart. "keepFields: false" + "naming.asLabels:
  # true" drops the symbol column from the plotted data but attaches it as
  # a field label on "close" in each split frame (confirmed against
  # Grafana's own transformer source/tests, not guessed) -- displayName
  # then renders that label as the legend/series name. A moving window by
  # design: a symbol with zero rows (sold, or "no_bars"/"no_valid_bars"
  # from prices.py's validation) simply contributes no series, matching
  # "currently held" semantics -- no redeploy needed when holdings change.
  #
  # Real bug found live (2026-08-08, browser-driven test against a real
  # local Grafana+Infinity container, not just re-reading the JSON):
  # partitionByValues's "fields" option matches against the query's
  # actual DataFrame field names, which come from each column's `text`
  # (not `selector`) in the target below. This JSON originally had
  # `text: "Symbol"` (capitalized) while the transform said
  # `fields: ["symbol"]` (lowercase) -- a silent, case-sensitive
  # mismatch. The transform's own source (grafana/grafana
  # partitionByValues.ts): zero matched fields -> "return [frame]"
  # unchanged, so every symbol rendered as one interleaved, zigzagging
  # line instead of separate series, with a single generic "Close"
  # legend entry instead of one per symbol. Fixed by lowercasing every
  # column's `text` to match `fields`/`displayName` exactly -- confirmed
  # live afterward with a real 2-symbol dataset (AAPL/MSFT) rendering as
  # two visually distinct lines with correct per-symbol legend entries.
  prices.json: |
    {
      "uid": "munger-prices",
      "title": "Held-symbol daily close prices",
      "tags": ["munger"],
      "timezone": "utc",
      "schemaVersion": 39,
      "version": 1,
      "editable": false,
      "refresh": "",
      "time": {"from": "now-1y", "to": "now"},
      "templating": {"list": []},
      "annotations": {"list": []},
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Daily close price per held ticker",
          "description": "Daily close prices for currently-held symbols (moving window -- a sold ticker's series drops off, a new buy's appears).",
          "gridPos": {"h": 14, "w": 24, "x": 0, "y": 0},
          "datasource": {"type": "yesoreyeram-infinity-datasource", "uid": "infinity-munger"},
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "displayName": "${__field.labels.symbol}",
              "custom": {"drawStyle": "line", "lineWidth": 2, "fillOpacity": 4, "showPoints": "auto", "spanNulls": true}
            },
            "overrides": []
          },
          "options": {
            "tooltip": {"mode": "multi", "sort": "none"},
            "legend": {"displayMode": "list", "placement": "bottom", "showLegend": true}
          },
          "transformations": [
            {
              "id": "partitionByValues",
              "options": {
                "fields": ["symbol"],
                "keepFields": false,
                "naming": {"asLabels": true}
              }
            }
          ],
          "targets": [
            {
              "refId": "A",
              "datasource": {"type": "yesoreyeram-infinity-datasource", "uid": "infinity-munger"},
              "type": "json",
              "source": "url",
              "format": "table",
              "parser": "backend",
              "url": "http://munger-report.munger.svc.cluster.local/prices_flat.json",
              "url_options": {"method": "GET", "data": ""},
              "root_selector": "",
              "columns": [
                {"selector": "symbol", "text": "symbol", "type": "string"},
                {"selector": "date", "text": "date", "type": "timestamp"},
                {"selector": "close", "text": "close", "type": "number"}
              ],
              "filters": []
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: munger-grafana
  namespace: munger
  labels:
    app.kubernetes.io/name: munger-grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: munger-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: munger-grafana
    spec:
      # Pinned OFF pi1 (the PVC/report host, memory-tight). Grafana only needs
      # HTTP to the in-cluster report Service, not the PVC, so it can run on
      # any other node.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["pi1"]
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          # Pin a tag the cluster can pull (arm64 multi-arch). Confirm/bump
          # as needed; keep it a fixed tag, not :latest.
          image: grafana/grafana:11.3.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_INSTALL_PLUGINS
              # Pinned -- see this ConfigMap's "INFINITY PLUGIN" comment
              # above for why (a real, currently-unfixed v3.11.2
              # regression breaks the plugin entirely). Space, not "@":
              # the docker image's run.sh word-splits this value into
              # `grafana cli plugins install <id> <version>` positional
              # args (confirmed against the image's actual run.sh and
              # `grafana cli plugins install --help`, not guessed --
              # "@3.11.1" silently 404'd instead of installing anything).
              value: "yesoreyeram-infinity-datasource 3.11.1"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_AUTH_BASIC_ENABLED
              value: "false"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_USERS_VIEWERS_CAN_EDIT
              value: "false"
            - name: GF_EXPLORE_ENABLED
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            # Let report.py's dashboards.html <iframe> embed the panels.
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboard-account-pnl
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            # Separate mount path from dashboard-account-pnl above -- matches
            # the separate provider entry in dashboard-provider's provider.yaml
            # (see that ConfigMap's comment for why this isn't just a second
            # file in the same directory).
            - name: dashboard-prices
              mountPath: /var/lib/grafana/dashboards-prices
              readOnly: true
      volumes:
        - name: grafana-data
          emptyDir: {}
        - name: datasources
          configMap:
            name: munger-grafana-datasources
        - name: dashboard-provider
          configMap:
            name: munger-grafana-dashboard-provider
        - name: dashboard-account-pnl
          configMap:
            name: munger-grafana-dashboard-account-pnl
        - name: dashboard-prices
          configMap:
            name: munger-grafana-dashboard-prices
---
# NodePort 30030 so the dashboards are reachable on the LAN and the report's
# dashboards.html <iframe> can point at them: set MUNGER_GRAFANA_URL to e.g.
# http://<node-ip>:30030/d/munger-account-pnl/account-p-l?kiosk on the
# daily-screen Job (report.py bakes it into the HTML at generation time).
apiVersion: v1
kind: Service
metadata:
  name: munger-grafana
  namespace: munger
  labels:
    app.kubernetes.io/name: munger-grafana
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: munger-grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030
