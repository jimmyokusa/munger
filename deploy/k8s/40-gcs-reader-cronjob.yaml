# M17 (DESIGN_DASHBOARDS.md 2.3): read-only GCS -> PVC bridge.
#
# WHY THIS EXISTS
#   pnl.py runs only in GitHub Actions (that's where the Alpaca credentials
#   live -- M14 screen-only boundary) and writes pnl.json + the durable
#   pnl_history.jsonl append-series into gs://munger-503515-data. The k3s
#   report deployment deliberately has no Alpaca keys and today has no
#   pnl.json on its PVC at all -- which is exactly why k3s pnl.html renders
#   an empty P&L page (M16 row 552). This CronJob PULLS the already-produced
#   artifacts from GCS into the shared PVC so (a) report.py's pnl.html gets
#   real data (closes M16 row 552) and (b) Grafana can chart the durable
#   history.
#
# WHY A STANDALONE CRONJOB (not an init step on daily-screen)
#   daily-screen runs 13:00 UTC; daily-trade (which produces the P&L) runs
#   14:00 UTC. Bolting this onto daily-screen would pull *yesterday's*
#   snapshot, and daily-screen's manifest is deliberately secret-free
#   (defense in depth) -- keep it that way. Originally ran once/day at
#   15:00 UTC (after daily-trade had a full hour, its own timeout is 45m,
#   to place trades, snapshot P&L, and upload to GCS); M19 (DESIGN.md 3.8.1)
#   moved this to every 30 min to match pnl-snapshot.yml's own intraday
#   cadence -- see the `schedule` field below, not this header, for the
#   current value.
#
# CREDENTIALS (read-only; NOT Alpaca)
#   Uses a dedicated GCP service account `munger-gcs-reader` with
#   roles/storage.objectViewer on the bucket -- bucket-wide *read-only*
#   (broader than the two files it actually reads, per M16 row 548 /
#   DESIGN_DASHBOARDS.md 2.3 blast-radius note) but read-only and not Alpaca
#   creds, so the trading boundary holds. gcs_bridge.py's google-cloud-storage
#   client authenticates via GOOGLE_APPLICATION_CREDENTIALS (ADC); the JSON key
#   is mounted from the Secret `munger-gcs-reader-key`, which must be created
#   out-of-band (never commit the key):
#
#     gcloud iam service-accounts create munger-gcs-reader \
#       --project=munger-503515
#     gcloud storage buckets add-iam-policy-binding gs://munger-503515-data \
#       --member=serviceAccount:munger-gcs-reader@munger-503515.iam.gserviceaccount.com \
#       --role=roles/storage.objectViewer
#     gcloud iam service-accounts keys create /tmp/gcs-reader.json \
#       --iam-account=munger-gcs-reader@munger-503515.iam.gserviceaccount.com
#     sudo kubectl -n munger create secret generic munger-gcs-reader-key \
#       --from-file=key.json=/tmp/gcs-reader.json
#     rm -f /tmp/gcs-reader.json
#
# ATOMICITY
#   Every file is downloaded to a temp path on the *same filesystem* (the
#   PVC) and then `mv`-renamed into place, so nginx/report.py/Grafana never
#   observe a torn or half-written file (the codebase's established
#   temp+rename pattern).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: munger-gcs-reader
  namespace: munger
  labels:
    app.kubernetes.io/name: munger-gcs-reader
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: munger-gcs-reader
  namespace: munger
  labels:
    app.kubernetes.io/name: munger-gcs-reader
spec:
  # M19 (DESIGN.md 3.8.1): every 30 min, matching pnl-snapshot.yml's own
  # cadence, so k3s dev doesn't silently lag Cloud Run prod's freshness --
  # not gated to market hours like pnl-snapshot.yml itself, since this job
  # makes no Alpaca call and no GCS write, only cheap read-only GCS GETs
  # (bucket.blob().download_to_filename), so there's no cost/rate-limit
  # reason to narrow its own schedule beyond "run often enough to matter."
  # A harmless no-op copy of the same content on a tick where pnl.py itself
  # skipped (outside real trading hours) is expected, not a bug.
  schedule: "*/30 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  # Was 3600s (appropriate when a missed daily tick had a full day before
  # the next one) -- at 30-min cadence that would let a missed tick fire
  # nearly an hour late, almost colliding with the next regular one, or
  # (per Kubernetes CronJob semantics) get silently dropped in favor of it
  # anyway once the deadline is that much longer than the interval between
  # ticks. Shrunk so a missed tick either catches up promptly or is cleanly
  # skipped for the next one, matching the new cadence rather than the old.
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: munger-gcs-reader
        spec:
          serviceAccountName: munger-gcs-reader
          restartPolicy: Never
          # Pinned to pi1: the PVC is ReadWriteOnce and lives on pi1 (see
          # 10-pvc.yaml), so anything that WRITES to it must run there.
          # (Grafana, which only READS the bridged files over HTTP via the
          # nginx Service, is pinned OFF pi1 in 50-grafana.yaml.)
          nodeSelector:
            kubernetes.io/hostname: pi1
          # Match the PVC's group-writable-by-uid-1000 convention
          # (30-daily-screen-cronjob.yaml uses the same fsGroup).
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: gcs-reader
              # Runs inside the side-loaded `munger` image (arm64, the same
              # one daily-screen/report-web use), NOT google/cloud-sdk:slim --
              # that image is amd64-only and died with `exec /bin/bash: exec
              # format error` on the arm64 Pis (found live, not theoretically).
              # The munger image already has python + google-cloud-storage
              # (requirements.txt), so gcs_bridge.py does the pull + JSONL->JSON
              # transform natively; no third-party image, no arch risk, and the
              # node needs no outbound internet to pull it (it's side-loaded).
              image: munger:latest
              imagePullPolicy: Never
              command: ["python", "gcs_bridge.py"]
              env:
                # gcs_bridge.py writes via config.PNL_DATA_PATH / REPORT_DIR,
                # both under MUNGER_DATA_DIR (=/data, the PVC mount).
                - name: MUNGER_DATA_DIR
                  value: /data
                # google-cloud-storage picks up the read-only SA key here (the
                # standard ADC env var), mounted from the Secret below.
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: /var/secrets/gcs/key.json
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: gcs-key
                  mountPath: /var/secrets/gcs
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 192Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: munger-data
            - name: gcs-key
              secret:
                secretName: munger-gcs-reader-key
